# Build linux/arm64 images and push to GHCR (stats + HMI only).

name: Build and push images (GHCR)

on:
  push:
    branches:
      - feature/pi-docker-stack
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PLATFORM: linux/arm64

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner for GHCR
        run: echo "OWNER_LOWER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push stats
        uses: docker/build-push-action@v6
        with:
          context: ./services/stats
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ghcr.io/${{ env.OWNER_LOWER }}/dronebros-stats:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push HMI
        uses: docker/build-push-action@v6
        with:
          context: ./services/hmi
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ghcr.io/${{ env.OWNER_LOWER }}/dronebros-hmi:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
