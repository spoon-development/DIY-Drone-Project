---
# Who to deploy to. Add more hosts under `all.hosts` or use groups as you grow.
#
# Set ansible_host to the Pi IP for how you connect (Wi‑Fi or Ethernet).
# Optional per host (default deploy dir is ~/dronebros — no sudo). For /opt set explicitly:
#   dronebros_deploy_dir: /opt/dronebros
#   ansible_ssh_private_key_file: ~/.ssh/id_ed25519

all:
  hosts:
    pi:
      ansible_host: 192.168.0.52
      ansible_user: spoon
