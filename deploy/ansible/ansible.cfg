[defaults]
inventory = ../inventory/hosts.yml
interpreter_python = auto_silent
host_key_checking = False
retry_files_enabled = False
# SSH / sudo over Ansible can be slow on a Pi; avoid spurious timeouts.
timeout = 120

[inventory]
enable_plugins = host_list, script, auto, yaml, ini

# Do not override ssh_args here. RequestTTY=force caused hangs on the first SSH
# module (non-interactive Ansible + forced PTY). For /opt deploys needing sudo,
# use deploy.sh -K / --ask-become-pass and a real TTY, or relax requiretty on the Pi.

[privilege_escalation]
become_timeout = 120
