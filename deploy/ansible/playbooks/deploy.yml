---
# Remote deploy: replace whatever was running with the current compose + images.
# Invoked by bash ./deploy/deploy.sh
#
# On the target: compose down (twice) → rm containers → optional registry pull → up --force-recreate.
# Default: deploy.sh ships images to the Pi (skip_image_pull true); Pi never pulls GHCR.
# Default deploy path: ~/dronebros (no sudo). Set dronebros_deploy_dir e.g. /opt/dronebros for a system path (needs sudo / -K).

- name: Drone Bros Inc — deploy stats + HMI + video
  hosts: all
  gather_facts: false
  become: false
  vars:
    deploy_dir: "{{ dronebros_deploy_dir | default('/home/' ~ ansible_user ~ '/dronebros', true) }}"
    skip_image_pull: false
    stack_reg: "{{ stack_image_registry | default('ghcr.io/spoon-development', true) }}"
    stack_tag: "{{ stack_image_tag | default('latest', true) }}"
    deploy_use_become: "{{ deploy_dir | regex_search('^/(opt|srv)(/|$)') is not none }}"
  tasks:
    - name: Ensure deploy directory exists (no sudo; default ~/dronebros)
      when: not (deploy_use_become | bool)
      become: false
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Ensure deploy directory exists (with sudo; /opt or /srv)
      when: deploy_use_become | bool
      become: true
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Ensure HMI settings directory (no sudo)
      when: not (deploy_use_become | bool)
      become: false
      ansible.builtin.file:
        path: "{{ deploy_dir }}/hmi-data"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Ensure HMI settings directory (with sudo)
      when: deploy_use_become | bool
      become: true
      ansible.builtin.file:
        path: "{{ deploy_dir }}/hmi-data"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Install docker compose file
      become: false
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../docker-compose.yml"
        dest: "{{ deploy_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Get host short name for HMI title (browser tab and header)
      become: false
      ansible.builtin.command: hostname
      register: hmi_display_hostname_cmd
      changed_when: false

    - name: Write .env from deploy/config/stack.yml
      become: false
      ansible.builtin.template:
        src: templates/dronebros.env.j2
        dest: "{{ deploy_dir }}/.env"
        mode: "0644"

    - name: Locate Pi firmware config.txt
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /boot/firmware/config.txt
        - /boot/config.txt
      register: boot_config_stats

    - name: Remember boot config path
      ansible.builtin.set_fact:
        pi_boot_config: "{{ (boot_config_stats.results | selectattr('stat.exists') | map(attribute='item') | list | first) | default('', true) }}"

    - name: Enable Raspberry Pi Camera Module 3 (MIPI) in boot config
      when:
        - (mipi_camera_configure | default(false)) | bool
        - pi_boot_config | length > 0
      become: true
      block:
        - name: Disable camera auto-detect (explicit Module 3 overlay)
          ansible.builtin.replace:
            path: "{{ pi_boot_config }}"
            regexp: '^camera_auto_detect=1'
            replace: 'camera_auto_detect=0'
          register: mipi_autodetect

        - name: Ensure imx708 overlay for CSI port
          ansible.builtin.lineinfile:
            path: "{{ pi_boot_config }}"
            regexp: '^dtoverlay=imx708'
            line: "dtoverlay={{ mipi_camera_overlay | default('imx708,cam1') }}"
            insertafter: '^\[all\]'
          register: mipi_overlay

        - name: Reboot Pi after MIPI camera boot config change
          ansible.builtin.reboot:
            reboot_timeout: 600
            msg: "Drone Bros enabled Raspberry Pi Camera Module 3 (MIPI)"
          when:
            - (mipi_camera_reboot | default(true)) | bool
            - mipi_autodetect.changed or mipi_overlay.changed

    - name: Compose teardown (containers, project network, compose-managed volumes)
      become: false
      ansible.builtin.command: docker compose down --remove-orphans --volumes
      args:
        chdir: "{{ deploy_dir }}"
      register: compose_down1
      failed_when: false
      changed_when: compose_down1.rc == 0

    - name: Compose teardown again (clear stuck state / old project name)
      become: false
      ansible.builtin.command: docker compose down --remove-orphans --volumes
      args:
        chdir: "{{ deploy_dir }}"
      register: compose_down2
      failed_when: false
      changed_when: compose_down2.rc == 0

    - name: Remove stack containers by name (cleanup if project name changed)
      become: false
      ansible.builtin.shell: docker rm -f dronebros-stats dronebros-hmi dronebros-video 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Pull images from registry (re-fetch tag; use policy when Compose supports it)
      become: false
      ansible.builtin.shell: |
        set -e
        cd "{{ deploy_dir }}"
        if docker compose pull --help 2>&1 | grep -qF -- '--policy'; then
          docker compose pull --policy always
        else
          docker compose pull
        fi
      when: not (skip_image_pull | bool)
      register: compose_pull
      changed_when: false
      failed_when: compose_pull.rc != 0

    - name: Start stack (always recreate containers from current images)
      become: false
      ansible.builtin.command: docker compose up -d --force-recreate --remove-orphans
      args:
        chdir: "{{ deploy_dir }}"
      register: compose_up
      changed_when: compose_up.rc == 0

    - name: Show running containers
      become: false
      ansible.builtin.command: docker compose ps
      args:
        chdir: "{{ deploy_dir }}"
      register: compose_ps
      changed_when: false

    - name: Print status
      ansible.builtin.debug:
        msg: "{{ compose_ps.stdout_lines }}"
