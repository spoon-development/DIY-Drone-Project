---
# Remote deploy: copy compose + .env, pull images, compose up.
# Invoked by bash ./deploy/deploy.sh (not by build.sh — local image builds are Docker-only).

- name: Drone Bros Inc — deploy stats + HMI
  hosts: all
  gather_facts: false
  vars:
    deploy_dir: "{{ dronebros_deploy_dir | default('/home/' ~ ansible_user ~ '/dronebros', true) }}"
    skip_image_pull: false
  tasks:
    - name: Ensure deploy directory
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: "0755"

    - name: Install docker compose file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../docker-compose.yml"
        dest: "{{ deploy_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Write .env from deploy/config/stack.yml
      ansible.builtin.copy:
        dest: "{{ deploy_dir }}/.env"
        content: |
          IMAGE_REGISTRY={{ stack_image_registry | default('ghcr.io/spoon-development', true) }}
          IMAGE_TAG={{ stack_image_tag | default('latest', true) }}
          HMI_HOST_PORT={{ hmi_host_port | default(8080) }}
        mode: "0644"

    - name: Pull images from registry
      ansible.builtin.command: docker compose pull
      args:
        chdir: "{{ deploy_dir }}"
      when: not (skip_image_pull | bool)
      register: compose_pull
      changed_when: false
      failed_when: compose_pull.rc != 0

    - name: Start stack
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ deploy_dir }}"
      register: compose_up
      changed_when: compose_up.rc == 0

    - name: Show running containers
      ansible.builtin.command: docker compose ps
      args:
        chdir: "{{ deploy_dir }}"
      register: compose_ps
      changed_when: false

    - name: Print status
      ansible.builtin.debug:
        msg: "{{ compose_ps.stdout_lines }}"
