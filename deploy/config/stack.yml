# Stack images (applied on the target as IMAGE_REGISTRY / IMAGE_TAG in .env next to docker-compose.yml).
# Image names themselves are fixed in docker-compose.yml (dronebros-stats, dronebros-hmi).
stack_image_registry: ghcr.io/spoon-development
stack_image_tag: latest

# CPU/OS of the Pi for deploy.sh bundle pulls (WSL/PC is usually amd64; without this, docker pull grabs amd64 and the Pi cannot run those images).
# If `docker save` fails with "content digest … not found" on WSL, install skopeo:  sudo apt install -y skopeo  (deploy.sh uses it automatically).
stack_bundle_platform: linux/arm64

# Default deploy (./deploy/deploy.sh): images are pulled on your laptop, tarred, copied, and docker load on the Pi — the Pi never contacts the registry.
# Use  bash ./build/build.sh  then  bash ./deploy/deploy.sh --local  to test on the Pi before push-images.sh.
# Set false only if you intentionally use ./deploy/deploy.sh --pull-on-pi (Pi must reach ghcr.io).
skip_image_pull: true

# Optional: published HMI port on the host (default 8080 if omitted).
# hmi_host_port: 8080

# Compose profiles (comma-separated). "video" starts the camera stack; "fc" starts mavlink-router + telemetry.
compose_profiles: video,fc

# Flight controller UART (SpeedyBee F405 v4 over Pi serial, MAVLink2). Override per board if needed.
fc_serial_device: /dev/ttyAMA0
fc_serial_baud: 921600
# ArduPilot SR{N}_* port index for the Pi UART (often 1 = TELEM1, not 0 = USB).
fc_mavlink_sr_port: 1

# MIPI boot config (dtoverlay in /boot/firmware/config.txt) — OFF by default.
# Deploy only ships containers; it does not edit Pi firmware. Third-party MIPI modules
# (e.g. Arducam UC-873 / IMX519) need a one-time OS/boot setup on the Pi before MIPI works.
mipi_camera_configure: false
# mipi_camera_overlay: imx519,cam1   # Arducam UC-873 (16MP IMX519); use cam0/cam1 for CSI port
# After first boot with imx519, install AF tuning on Ubuntu (stock imx519.json has no rpi.af):
#   sudo cp /usr/share/libcamera/ipa/rpi/pisp/imx519.json{,.bak}
#   sudo curl -fsSL -o /usr/share/libcamera/ipa/rpi/pisp/imx519.json \
#     https://raw.githubusercontent.com/ArduCAM/libcamera/arducam/src/ipa/rpi/pisp/data/imx519.json
# mipi_camera_overlay: imx219,cam1   # Pi Camera Module 2.1
# mipi_camera_reboot: true
