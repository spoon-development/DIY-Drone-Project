server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Browser → single origin; nginx fans out to internal services.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /stream {
        return 302 /stream/;
    }

    location /stream/ {
        proxy_pass http://video-stream:8080/cam.mjpg;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/stats {
        proxy_pass http://stats:9101/metrics;
        proxy_buffering off;
        proxy_read_timeout 10s;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store" always;
    }
}
