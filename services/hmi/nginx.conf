server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single origin: UI + /api/stats (backend is internal to this compose network).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/stats {
        proxy_pass http://stats:9101/metrics;
        proxy_buffering off;
        proxy_read_timeout 10s;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store" always;
    }
}
