# Local dev only — merged with docker-compose.yml on your machine (never copied to the Pi alone).
# Adds build.context for ./services/* so you can build without pulling from GHCR.
#
#   bash ./deploy/build.sh
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d

services:
  stats:
    build:
      context: ./services/stats

  hmi:
    build:
      context: ./services/hmi
