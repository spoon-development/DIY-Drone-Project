# Optional cameras (V4L2): MIPI (Pi Camera Module 3) or USB (MJPEG). Enable profile `video` via COMPOSE_PROFILES (see stack.yml). Video container is privileged so missing camera nodes do not block compose up.
#
# This file is what we copy to the Pi: image-only (GHCR), no ./services paths on the device.
# Local builds use docker-compose.build.yml merged in — see build/build.sh.
#
# Vars: IMAGE_REGISTRY, IMAGE_TAG, HMI_HOST_PORT (defaults inline below; Ansible writes .env from deploy/config/stack.yml).
#
# Offline Pi: default deploy.sh pulls on your machine, scp + docker load on the Pi (see deploy/deploy.sh). Use --pull-on-pi only if the Pi can reach the registry.

name: dronebros

services:
  stats:
    image: ${IMAGE_REGISTRY:-ghcr.io/spoon-development}/dronebros-stats:${IMAGE_TAG:-latest}
    container_name: dronebros-stats
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9101/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - dronebros
    logging: &log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "4"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host_root:ro
    environment:
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_ROOT: /host_root

  video:
    profiles:
      - video
    image: ${IMAGE_REGISTRY:-ghcr.io/spoon-development}/dronebros-video:${IMAGE_TAG:-latest}
    container_name: dronebros-video
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/host:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/health"]
      interval: 15s
      timeout: 6s
      retries: 4
      start_period: 20s
    networks:
      - dronebros
    logging: *log
    environment:
      VIDEO_DEFAULT_PROFILE: ${VIDEO_DEFAULT_PROFILE:-uc60}

  mavrouter:
    profiles:
      - fc
    image: ${IMAGE_REGISTRY:-ghcr.io/spoon-development}/dronebros-mavrouter:${IMAGE_TAG:-latest}
    container_name: dronebros-mavrouter
    restart: unless-stopped
    depends_on:
      telemetry:
        condition: service_started
    # Serial path is configurable (FC_SERIAL_DEVICE / fc_serial_device). Mount /dev instead of
    # devices: so compose up succeeds when the port is missing or UART is not enabled yet.
    privileged: true
    group_add:
      - dialout
    volumes:
      - fc-config:/config
      - /dev:/dev
    environment:
      FC_SERIAL_DEVICE: ${FC_SERIAL_DEVICE:-/dev/ttyAMA0}
      FC_SERIAL_BAUD: ${FC_SERIAL_BAUD:-921600}
      FC_TELEMETRY_UDP_HOST: telemetry
      FC_TELEMETRY_UDP_PORT: "14551"
    networks:
      - dronebros
    logging: *log

  telemetry:
    profiles:
      - fc
    image: ${IMAGE_REGISTRY:-ghcr.io/spoon-development}/dronebros-telemetry:${IMAGE_TAG:-latest}
    container_name: dronebros-telemetry
    restart: unless-stopped
    volumes:
      - fc-config:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9102/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - dronebros
    logging: *log
    environment:
      MAVLINK_UDP_PORT: "14551"
      FC_MAVLINK_SR_PORT: ${FC_MAVLINK_SR_PORT:-1}
      FC_SR_EXTRA1_HZ: ${FC_SR_EXTRA1_HZ:-10}
      FC_SR_EXTRA2_HZ: ${FC_SR_EXTRA2_HZ:-5}
      FC_SR_EXTRA3_HZ: ${FC_SR_EXTRA3_HZ:-5}
      FC_SR_EXT_STAT_HZ: ${FC_SR_EXT_STAT_HZ:-2}
      FC_SR_APPLY_ON_CONNECT: ${FC_SR_APPLY_ON_CONNECT:-1}
      FC_SERIAL_DEVICE: ${FC_SERIAL_DEVICE:-/dev/ttyAMA0}
      FC_SERIAL_BAUD: ${FC_SERIAL_BAUD:-921600}
      TELEMETRY_CONFIG_DIR: /config

  hmi:
    image: ${IMAGE_REGISTRY:-ghcr.io/spoon-development}/dronebros-hmi:${IMAGE_TAG:-latest}
    container_name: dronebros-hmi
    restart: unless-stopped
    # See host netplan + run netplan apply in the host namespace (nsenter -t 1 …).
    pid: host
    privileged: true
    ports:
      - "${HMI_HOST_PORT:-8080}:80"
    volumes:
      - ${HMI_DATA_DIR:-./hmi-data}:/data
      - /etc/netplan:/etc/netplan:rw
    environment:
      # Browser title / header when stats is down (Ansible writes DISPLAY_HOSTNAME in .env).
      DISPLAY_HOSTNAME: ${DISPLAY_HOSTNAME:-}
      # Try service DNS name, then container_name (some Docker/Compose setups differ).
      STATS_METRICS_URLS: http://stats:9101/metrics,http://dronebros-stats:9101/metrics
      VIDEO_SERVICE_URL: http://video:8765
      TELEMETRY_SERVICE_URL: http://telemetry:9102
      # Network apply runs netplan on the host; do not reboot — keeps HMI reachable over Wi-Fi.
      HMI_REBOOT_AFTER_NETPLAN: "0"
    depends_on:
      stats:
        condition: service_healthy
    networks:
      - dronebros
    logging:
      <<: *log

networks:
  dronebros:
    driver: bridge

volumes:
  fc-config:
