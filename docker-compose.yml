# Drone Bros Inc — stats + HMI only. One published port (HMI); stats API is internal.
#
# This file is what we copy to the Pi: image-only (GHCR), no ./services paths on the device.
# Local builds use docker-compose.build.yml merged in — see deploy/build.sh.
#
# Vars: IMAGE_REGISTRY, IMAGE_TAG, HMI_HOST_PORT (defaults inline below; Ansible writes .env from deploy/config/stack.yml).
#
# Offline: docker load on the Pi, set skip_image_pull: true in deploy/config/stack.yml, then bash ./deploy/deploy.sh.

name: dronebros

services:
  stats:
    image: ${IMAGE_REGISTRY:-ghcr.io/spoon-development}/dronebros-stats:${IMAGE_TAG:-latest}
    container_name: dronebros-stats
    restart: unless-stopped
    networks:
      - dronebros
    logging: &log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "4"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host_root:ro
    environment:
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_ROOT: /host_root

  hmi:
    image: ${IMAGE_REGISTRY:-ghcr.io/spoon-development}/dronebros-hmi:${IMAGE_TAG:-latest}
    container_name: dronebros-hmi
    restart: unless-stopped
    ports:
      - "${HMI_HOST_PORT:-8080}:80"
    depends_on:
      - stats
    networks:
      - dronebros
    logging:
      <<: *log

networks:
  dronebros:
    driver: bridge
