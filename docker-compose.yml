# Drone Bros Inc — stats + HMI only. One published port (HMI); stats API is internal.
#
# Images: pre-built on GitHub Actions → GHCR (linux/arm64). On the Pi:
#   docker compose pull && docker compose up -d
#
# Offline: load a tar from your laptop (`scripts/export-images.sh`) then `docker compose up -d`
#   with pull skipped — see deploy/ansible and README.

name: dronebros

services:
  stats:
    image: ${IMAGE_REGISTRY:-ghcr.io/spoon-development}/dronebros-stats:${IMAGE_TAG:-latest}
    container_name: dronebros-stats
    restart: unless-stopped
    networks:
      - dronebros
    logging: &log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "4"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host_root:ro
    environment:
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_ROOT: /host_root

  hmi:
    image: ${IMAGE_REGISTRY:-ghcr.io/spoon-development}/dronebros-hmi:${IMAGE_TAG:-latest}
    container_name: dronebros-hmi
    restart: unless-stopped
    ports:
      - "${HMI_HOST_PORT:-8080}:80"
    depends_on:
      - stats
    networks:
      - dronebros
    logging:
      <<: *log

networks:
  dronebros:
    driver: bridge
